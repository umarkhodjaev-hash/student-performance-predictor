               class="nav-button">

            </a>

        </div>

    </nav>

<!-- =========================
     MAIN
========================= -->

<main class="improve-page">


    <!-- HEADER -->

    <section class="improve-header">

        <div class="tag">
            IMPROVE YOUR ROUTINE
        </div>

        <h1>
            Small changes.<br>
            Better academic habits.
        </h1>

        <p>
            Academic performance is influenced by more than study time alone.
            Explore the factors included in our model and build a more
            consistent academic routine.
        </p>

    </section>


    <!-- =========================
         IMPROVEMENT CARDS
    ========================== -->

    <section class="improvement-grid">


        <div class="improvement-card">

            <div class="improvement-number">
                01
            </div>

            <h2>
                Study Consistently
            </h2>

            <p>
                Focus on consistent study sessions instead of relying on
                last-minute preparation before an exam.
            </p>

            <div class="improvement-tip">

                <span>
                    TRY THIS
                </span>

                Plan focused study blocks throughout the week.

            </div>

        </div>


        <div class="improvement-card">

            <div class="improvement-number">
                02
            </div>

            <h2>
                Protect Your Attendance
            </h2>

            <p>
                Regular attendance helps maintain continuity and reduces
                the amount of material that needs to be recovered later.
            </p>

            <div class="improvement-tip">

                <span>
                    TRY THIS
                </span>

                Track missed classes and catch up on missed material quickly.

            </div>

        </div>


        <div class="improvement-card">

            <div class="improvement-number">
                03
            </div>

            <h2>
                Build a Sleep Routine
            </h2>

            <p>
                A consistent sleep schedule can support attention, learning
                and your ability to maintain a productive routine.
            </p>

            <div class="improvement-tip">

                <span>
                    TRY THIS
                </span>

                Keep your sleeping and waking times reasonably consistent.

            </div>

        </div>


        <div class="improvement-card">

            <div class="improvement-number">
                04
            </div>

            <h2>
                Track Your Progress
            </h2>

            <p>
                Previous academic performance can help reveal whether your
                current study strategy is producing the results you expect.
            </p>

            <div class="improvement-tip">

                <span>
                    TRY THIS
                </span>

                Compare your results over time instead of focusing on one test.

            </div>

        </div>


        <div class="improvement-card">

            <div class="improvement-number">
                05
            </div>

            <h2>
                Work With Your Motivation
            </h2>

            <p>
                Motivation changes over time. Clear goals can make it easier
                to continue working when motivation temporarily drops.
            </p>

            <div class="improvement-tip">

                <span>
                    TRY THIS
                </span>

                Turn large academic goals into smaller weekly targets.

            </div>

        </div>


        <div class="improvement-card">

            <div class="improvement-number">
                06
            </div>

            <h2>
                Ask for Support
            </h2>

            <p>
                Tutoring or additional academic support can help when a
                difficult topic becomes an obstacle to further progress.
            </p>

            <div class="improvement-tip">

                <span>
                    TRY THIS
                </span>

                Identify difficult topics early instead of waiting until exams.

            </div>

        </div>


        <div class="improvement-card">

            <div class="improvement-number">
                07
            </div>

            <h2>
                Stay Physically Active
            </h2>

            <p>
                Physical activity can be one part of a balanced routine
                alongside studying, rest and other responsibilities.
            </p>

            <div class="improvement-tip">

                <span>
                    TRY THIS
                </span>

                Make regular movement part of your weekly schedule.

            </div>

        </div>


        <div class="improvement-card">

            <div class="improvement-number">
                08
            </div>

            <h2>
                Build Beyond the Classroom
            </h2>

            <p>
                Extracurricular activities can provide opportunities to
                develop interests, collaboration and time-management skills.
            </p>

            <div class="improvement-tip">

                <span>
                    TRY THIS
                </span>

                Choose activities you value without overloading your schedule.

            </div>

        </div>

    </section>


    <!-- =========================
         REMINDER
    ========================== -->

    <section class="improve-note">

        <div>

            <div class="tag">
                REMEMBER
            </div>

            <h2>
                Your score is information, not a label.
            </h2>

            <p>
                The predictor is designed to help you explore patterns in your
                academic routine. Its estimate should be treated as a starting
                point for reflection rather than a judgment of your ability.
            </p>

        </div>

    </section>


    <!-- =========================
         CTA
    ========================== -->

    <section class="improve-cta">

        <div>

            <h2>
                See what your data says.
            </h2>

            <p>
                Analyze your current routine and discover areas you may want
                to work on.
            </p>

        </div>


        <a href="/predict"
           class="primary-button">

            Analyze My Performance →

        </a>

    </section>

</main>
